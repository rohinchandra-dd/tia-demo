name: Setup Demo Environment
description: Python, dependencies, Datadog Test Optimization, and optional ddtest. Run actions/checkout first.

inputs:
  install_ddtest:
    description: Download ddtest binary for parallelization workflows
    required: false
    default: "false"
  datadog_site:
    description: Datadog site
    required: false
    default: datadoghq.com

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: python -m pip install -r requirements.txt

    - name: Configure Datadog Test Optimization
      uses: datadog/test-visibility-github-action@v3
      with:
        languages: python
        api_key: ${{ env.DD_API_KEY }}
        site: ${{ inputs.datadog_site }}

    - name: Download ddtest binary
      if: inputs.install_ddtest == 'true'
      shell: bash
      run: |
        mkdir -p bin
        gh release download --repo DataDog/ddtest --pattern "ddtest-linux-amd64" --dir bin
        mv bin/ddtest-linux-amd64 bin/ddtest
        chmod +x bin/ddtest
      env:
        GH_TOKEN: ${{ github.token }}
