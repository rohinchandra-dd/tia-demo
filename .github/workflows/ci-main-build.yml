name: CI - Main Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DD_ENV: ci
  DD_SERVICE: demo-main-build

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run full test suite with Auto Test Retries
        run: pytest tests/ --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-main-build
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_COUNT: "3"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying commit ${GITHUB_SHA} to staging..."
          echo "Deployment complete (demo noop)."
