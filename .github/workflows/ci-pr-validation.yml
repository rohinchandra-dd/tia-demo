name: CI - PR Validation

on:
  pull_request:
  workflow_dispatch:

env:
  DD_ENV: ci
  DD_SERVICE: demo-pr-validation
  DD_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DD_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  fast-test-job:
    name: fast-test-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run fast test scenario (< 30s, reports to Datadog)
        run: pytest tests/test_pr_signals_demo.py --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-pr-validation
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_AUTO_TEST_RETRIES_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_COUNT: "0"

  slow-build-job:
    name: slow-build-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Slow build step (fails after 2m on attempt 1, passes on retry)
        shell: bash
        run: |
          if [ "${GITHUB_RUN_ATTEMPT:-1}" = "1" ]; then
            echo "Attempt 1: running 2-minute workload to demonstrate Slack message update..."
            sleep 120
            echo "Simulated slow job failure for PR Signals update demo"
            exit 1
          else
            echo "Manual retry detected (attempt ${GITHUB_RUN_ATTEMPT}) — passing!"
            exit 0
          fi

  optional-job:
    name: optional-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Optional failing check (demonstrates PR Signals ignores non-required failures)
        shell: bash
        run: |
          echo "Simulating optional / non-required check..."
          sleep 10
          if [ "${GITHUB_RUN_ATTEMPT:-1}" = "1" ]; then
            echo "Intentional optional job failure (AllowedToFail demo)"
            exit 1
          else
            echo "Optional check passed on retry"
            exit 0
          fi
