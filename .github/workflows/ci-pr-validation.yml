name: CI - PR Validation

on:
  pull_request:
  workflow_dispatch:

env:
  DD_ENV: ci
  DD_SERVICE: demo-pr-validation

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run unit tests with TIA
        run: pytest tests/ --ignore=tests/integration --ignore=tests/flaky --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-pr-validation

  integration-smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run integration smoke tests
        run: pytest tests/integration -m smoke --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-pr-validation
