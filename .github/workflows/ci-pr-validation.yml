name: CI - PR Validation

on:
  pull_request:
  workflow_dispatch:

env:
  DD_ENV: ci
  DD_SERVICE: demo-pr-validation
  DD_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DD_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  fast-test-job:
    name: fast-test-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run fast test scenario (< 30s, reports to Datadog)
        shell: bash
        env:
          DD_ENV: ci
          DD_SERVICE: demo-pr-validation
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_AUTO_TEST_RETRIES_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_COUNT: "0"
        run: |
          pytest tests/test_pr_signals_demo.py --ddtrace -v
          echo "Fast test check passed"

  slow-build-job:
    name: slow-build-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Build step
        shell: bash
        run: |
          echo "Build step passed successfully"
          exit 0

  optional-job:
    name: optional-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Optional check
        shell: bash
        run: |
          echo "Optional check passed"
          exit 0
