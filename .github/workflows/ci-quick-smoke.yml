name: CI - Quick Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  DD_ENV: ci
  DD_SERVICE: demo-quick-smoke

jobs:
  quick-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run fast smoke tests
        run: pytest -m "not slow and not flaky_demo" --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-quick-smoke
