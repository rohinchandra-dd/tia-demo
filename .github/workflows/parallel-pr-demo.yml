name: Parallel PR Demo

# Three-way contrast of the SAME suite on the SAME commit, differing only in how
# test files are distributed across nodes:
#
#   naive      4 fixed nodes, split by file COUNT       -> slowest node ~69s
#   smart      ddtest picks the node count, by DURATION -> all nodes ~38s
#   tia-smart  TIA prunes first, then duration split    -> all nodes ~16s
#
# The `paths` filter keeps this off the TIA demo's PR, which also targets
# `preprod` but touches src/billing. For pull_request events GitHub evaluates
# `paths` against the whole PR diff (a three-dot diff against the merge base),
# not the latest push, so re-triggering with an empty commit still matches.
# Do NOT add `paths` to the push trigger: that uses a two-dot diff, where an
# empty commit changes nothing and the seeding run would silently not fire.
#
# The push leg is the seeding run. `ddtest` splits on Datadog p50 timings and
# falls back to file-size heuristics without them; our durations are artificial
# sleeps uncorrelated with file size, so a cold service splits badly and the
# `smart` leg looks no better than `naive`. Let a few preprod pushes land first.

on:
  pull_request:
    branches:
      - preprod
    paths:
      - "src/analytics/**"
      - "src/auth/**"
      - "src/catalog/**"
      - "src/inventory/**"
  push:
    branches:
      - preprod
  workflow_dispatch:

concurrency:
  group: parallel-demo-${{ github.ref }}
  # Cancel superseded runs on a PR (re-triggering with an empty commit should
  # not leave 14 stale jobs running), but never cancel push/dispatch runs:
  # those are the seeding runs, and each one is a p50 timing sample we want.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DD_ENV: ci
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: python
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: pytest
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: 1
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: 8
  # Load-bearing. ddtest scores each candidate as
  # (slowest-worker time + nodes x overhead) and prefers fewer nodes on ties.
  # Against 150s of work the 25s default scores 2 nodes best and lands at ~75s,
  # barely beating the naive split. At 5s, 4 nodes wins and lands at ~38s.
  DD_TEST_OPTIMIZATION_RUNNER_CI_JOB_OVERHEAD: 5s

jobs:
  # ---------------------------------------------------------------- leg A
  naive:
    name: naive (node ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run shard split by file count
        # Deliberately the sharding most teams hand-roll: 41 files chopped into
        # four equal-COUNT contiguous chunks, with no idea what each one costs.
        # Verified to partition all 41 files with no overlap, at 69/32/16/33s.
        run: |
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done \
            < <(find tests -name 'test_*.py' -not -path 'tests/flaky/*' | sort)
          T=${#FILES[@]}; N=4; I=${{ matrix.shard }}
          S=$(( I * T / N )); E=$(( (I + 1) * T / N ))
          echo "shard $I/$N: $((E - S)) of $T files"
          printf '  %s\n' "${FILES[@]:S:E-S}"
          pytest "${FILES[@]:S:E-S}" --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-naive
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"

  # ---------------------------------------------------------------- leg B
  smart_plan:
    name: smart (plan)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - id: dd_plan
        name: Plan split by duration
        # --tests-exclude-pattern is required: pyproject's testpaths = ["tests"]
        # means the planner would otherwise discover tests/flaky, which fails by
        # design and would sink the leg for reasons unrelated to splitting.
        run: |
          bin/ddtest plan --tests-exclude-pattern 'tests/flaky/**'
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-smart
          # See the note on the run step below. On a PR, ITR off keeps the plan
          # from pruning files so this leg stays a full-suite comparison
          # against `naive`; on a push it is on so durations keep flowing.
          DD_CIVISIBILITY_ITR_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
      - name: Report chosen parallelism
        run: |
          count=$(cat .testoptimization/runner/parallel-runners.txt)
          files=$(wc -l < .testoptimization/runner/test-files.txt)
          echo "### smart: ddtest chose **${count}** node(s) for ${files} files" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dd-artifacts-parallel-smart
          path: .testoptimization
          include-hidden-files: true

  smart:
    name: smart (node ${{ matrix.ci_node_index }})
    runs-on: ubuntu-latest
    needs: [smart_plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.smart_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: dd-artifacts-parallel-smart
          path: .testoptimization
      - name: Run duration-split node
        run: bin/ddtest run --ci-node ${{ matrix.ci_node_index }}
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-smart
          # ITR is ON for push (seeding) and OFF for pull_request (the demo).
          #
          # Measured: with DD_CIVISIBILITY_ITR_ENABLED=false the service reports
          # no test suite durations at all, and `ddtest plan` logs
          #   WARN "Test durations API returned no test suites" ... count=0
          # falling back to file-size weights. Those are uncorrelated with our
          # artificial sleeps, so the split came out WORSE than `naive`
          # (131s slowest node vs naive's 97s). Duration-aware splitting needs
          # the Test Optimization data that ITR collection produces.
          #
          # `preprod` is a TIA excluded branch, so leaving ITR on for the push
          # leg seeds durations while skipping nothing. On the PR we turn it off
          # so this leg runs the FULL suite and stays comparable to `naive` —
          # by then the durations are already seeded.
          DD_CIVISIBILITY_ITR_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

  # ---------------------------------------------------------------- leg C
  tia_smart_plan:
    name: tia-smart (plan)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - id: dd_plan
        name: Plan split by duration, TIA enabled
        # No DD_CIVISIBILITY_ITR_ENABLED here: TIA is on by default, so the plan
        # only contains files with at least one non-skipped test.
        run: |
          bin/ddtest plan --tests-exclude-pattern 'tests/flaky/**'
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-tia
      - name: Report chosen parallelism
        run: |
          count=$(cat .testoptimization/runner/parallel-runners.txt)
          files=$(wc -l < .testoptimization/runner/test-files.txt)
          skipped=$(cat .testoptimization/runner/skippable-percentage.txt 2>/dev/null || echo "n/a")
          echo "### tia-smart: ddtest chose **${count}** node(s) for ${files} files (TIA skippable: ${skipped})" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dd-artifacts-parallel-tia
          path: .testoptimization
          include-hidden-files: true

  tia_smart:
    name: tia-smart (node ${{ matrix.ci_node_index }})
    runs-on: ubuntu-latest
    needs: [tia_smart_plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.tia_smart_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: dd-artifacts-parallel-tia
          path: .testoptimization
      - name: Run TIA + duration-split node
        run: bin/ddtest run --ci-node ${{ matrix.ci_node_index }}
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-tia
