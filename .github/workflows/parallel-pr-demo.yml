name: Parallel PR Demo

# Three-way contrast of the SAME suite on the SAME commit, differing only in how
# test files are distributed across nodes:
#
#   naive   4 fixed nodes, split by file COUNT        -> slowest node ~204s
#   smart   ddtest picks the node count, by DURATION  -> nodes finish together
#
# Parallelization ONLY. Test Impact Analysis has its own demo (DEMO.md B0);
# mixing them here made the two ddtest legs indistinguishable and muddied what
# the contrast was attributable to.
#
# TIA stays ENABLED on the ddtest legs. This demo is the third bar of the
# 3/2/1 story: naive -> TIA -> TIA + parallelization. The TIA demo (DEMO.md B0)
# shows that TIA leaves one node carrying nearly all the duration; here ddtest
# redistributes that same selected set so every node finishes together.
#
# Note DD_CIVISIBILITY_ITR_ENABLED cannot turn TIA off here anyway: it is a
# ddtrace setting, and `ddtest` queries Datadog for skippable tests and
# deselects them before pytest starts. Measured: a leg with that variable set
# to "false" still ran only 288 of 965 tests.
#
# The `paths` filter keeps this off the TIA demo's PR, which also targets
# `preprod` but touches a disjoint set of domains
# (analytics/catalog/inventory/shared). For pull_request events GitHub evaluates
# `paths` against the whole PR diff (a three-dot diff against the merge base),
# not the latest push, so re-triggering with an empty commit still matches.
# Do NOT add `paths` to the push trigger: that uses a two-dot diff, where an
# empty commit changes nothing and the seeding run would silently not fire.
#
# The push leg is the seeding run. `ddtest` splits on Datadog p50 timings, and
# without them it falls back to ONE SECOND PER TEST -- measured on the plan of
# run 37250040102, where a 72-test heavy suite was weighted at 1m12s and a
# 12-test light one at 12s. Not file size. That distinction matters: on a demo
# PR, TIA skipping suppresses the duration lookup, so the planner sizes the
# selected set as 17 identical 12s suites and OUR sleep_seconds budgets are
# invisible to it. Retuning durations cannot move the runner count; only
# CI_JOB_OVERHEAD and the selected file count can.
#
# Run `scripts/seed_preprod.sh` after any change to scripts/domain_spec.json,
# and before demoing run the `Demo Preflight` workflow.

on:
  pull_request:
    branches:
      - preprod
    paths:
      - "src/auth/**"
      - "src/compliance/**"
      - "src/notifications/**"
      - "src/shipping/**"
  push:
    branches:
      - preprod
  workflow_dispatch:

concurrency:
  group: parallel-demo-${{ github.ref }}
  # Cancel superseded runs on a PR (re-triggering with an empty commit should
  # not leave 14 stale jobs running), but never cancel push/dispatch runs:
  # those are the seeding runs, and each one is a p50 timing sample we want.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DD_ENV: ci
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: python
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: pytest
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: 1
  # Capped at 4 to stay like-for-like with the `naive` leg's 4 fixed nodes, so
  # "allowed 4, chose fewer" reads cleanly next to it. The cap is NOT what
  # reduces the runner count -- CI_JOB_OVERHEAD below is. On an earlier config
  # with the cap at 8, ddtest picked 6 and two nodes finished in ~4s.
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: 4
  # Load-bearing, and the whole point of the cost demo. ddtest scores each
  # candidate as (slowest-worker time + runners x overhead) and takes the
  # minimum, so this is where you tell it what a runner costs you.
  #
  # `scripts/measure_job_overhead.py` measures it. Pooled over 13 runner jobs
  # across 4 runs: queue 2s + setup ~28s = p50 **30s** of pure waste per
  # runner. But raw seconds are not the bill. GitHub invoices each job
  # separately and rounds every one UP to a whole minute, so the marginal cost
  # of adding a runner is never below 60s however briefly it runs:
  #
  #   run 37250040102, 135s of selected test time, +1 min for the plan job
  #     1 runner   job 165s  ->  4 billed min
  #     2 runners  job  98s  ->  5 billed min
  #     3 runners  job  75s  ->  7 billed min
  #     4 runners  job  64s  ->  9 billed min   <- what 5s bought us
  #   the naive leg, running 5x more test work, also bills 9 min.
  #
  # At 4 runners this leg cost exactly as much as `naive` despite running a
  # fifth of the tests -- every second saved was handed back as rounding. 60s
  # is that rounding expressed in the planner's own units, and at 60s it
  # selects 2 runners (score 228s, vs 252s for 3 and 264s for 1).
  #
  # The measured-but-unrounded 30s would select 3, by only 6s over 2 -- inside
  # the noise of the measurement. Re-run the script if the suite shape changes.
  DD_TEST_OPTIMIZATION_RUNNER_CI_JOB_OVERHEAD: 60s

jobs:
  # ---------------------------------------------------------------- leg A
  naive:
    name: naive (node ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run shard split by file count
        # The same count-based split the TIA demo uses, so node times are
        # directly comparable across the two demos. 41 files chopped into four
        # equal-COUNT chunks with no idea what each costs: 204/124/8/8s.
        run: |
          pytest $(python scripts/shard_by_count.py --shard ${{ matrix.shard }} --nodes 4) \
            --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-naive
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"

  # ---------------------------------------------------------------- leg B
  tia_parallel_plan:
    name: tia-parallel (plan)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - id: dd_plan
        name: Plan split by duration
        # --tests-exclude-pattern is required: pyproject's testpaths = ["tests"]
        # means the planner would otherwise discover tests/flaky, which fails by
        # design and would sink the leg for reasons unrelated to splitting.
        run: |
          set -o pipefail
          bin/ddtest plan --tests-exclude-pattern 'tests/flaky/**' 2>&1 \
            | tee ddtest-plan.log
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-smart
          # ITR deliberately left ON (no DD_CIVISIBILITY_ITR_ENABLED here).
          # It is both what selects the impacted tests and what makes the
          # backend test-suite durations available; setting it "false"
          # suppresses the durations entirely:
          #   WARN "Test durations API returned no test suites"
      - name: Report plan quality
        # Without backend p50s, ddtest weights every suite at ONE SECOND PER
        # TEST -- uncorrelated with our artificial sleeps -- so the fallback
        # can silently produce a split no better than `naive`, measured once at
        # 29/27/141/141s off "Backend durations used: 0 suites". It still
        # reports as a green, successful run, which makes it the worst possible
        # thing to discover live.
        #
        # This step only REPORTS, deliberately. It does not fail the job,
        # because a red X mid-webinar is worse than a degraded bar, and because
        # the zero-durations condition may be structural rather than a seeding
        # gap (see DEMO.md B1 -- TIA skipping and the durations lookup appear to
        # interact). The hard gate lives in demo-preflight.yml, which you run
        # BEFORE the webinar, when there is still time to react.
        run: |
          set -euo pipefail
          nodes=$(tr -dc '0-9' < .testoptimization/runner/parallel-runners.txt)
          files=$(wc -l < .testoptimization/runner/test-files.txt | tr -d ' ')
          # "Backend durations used: N suites" -- matched loosely so a change in
          # ddtest's wording degrades to "unknown" rather than a false failure.
          # Anchored on "Backend durations used: N suites". Do NOT loosen this:
          # the very next line is "Default durations used: 0 suites", so a
          # pattern that merely looks for "<N> suites" near the word "duration"
          # picks up the 0 and reports a healthy plan as a broken one.
          suites=$(grep -oiE 'Backend durations used:[[:space:]]*[0-9,]+' \
            ddtest-plan.log | grep -oE '[0-9,]+$' | tr -d ',' | tail -1 || true)
          {
            echo "### tia-parallel plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| nodes chosen | **${nodes}** |"
            echo "| test files selected | ${files} |"
            echo "| backend duration suites | ${suites:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Measured 2026-10-05, same commit, two runs: a preprod push with
          # "Test skipping: disabled" got "Backend durations used: 41 suites",
          # and the PR run with skipping enabled and 764 skippables returned got
          # "0 suites / Default: 41". TIA skipping suppresses the durations
          # lookup. On a demo PR that is EXPECTED, not a seeding gap, and no
          # amount of re-seeding changes it -- so do not send people to
          # seed_preprod.sh for it. The split is still fine here because the
          # selected set is 4 heavy files and 13 light ones, so any sane 4-way
          # split lands one heavy per node (measured 61/62/61/64s).
          skipping_on=no
          grep -qiE 'Test skipping:[[:space:]]*enabled' ddtest-plan.log \
            && skipping_on=yes

          reason=""
          note=""
          if [ "${suites:-}" = "0" ] \
            || grep -qi 'durations API returned no test suites' ddtest-plan.log; then
            if [ "$skipping_on" = yes ]; then
              note="Backend durations are suppressed while TIA skipping is active (expected; see DEMO.md B1). The split used default weights -- confirm the node times below are within a few seconds of each other."
            else
              reason="ddtest got NO backend durations and TIA skipping is off, so p50 timings for this service are genuinely cold."
            fi
          elif [ "$nodes" -lt 2 ]; then
            reason="ddtest chose ${nodes} node(s); the demo needs a real split."
          fi

          if [ -n "$reason" ]; then
            {
              echo ""
              echo "> [!CAUTION]"
              echo "> ${reason}"
              echo "> This split is **not** duration-based, so the nodes will not"
              echo "> finish together and this leg may be no faster than \`naive\`."
              echo "> Run \`scripts/seed_preprod.sh 3\`, then the \`Demo Preflight\`"
              echo "> workflow, before relying on this bar. See DEMO.md B1."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${reason} See DEMO.md B1; run scripts/seed_preprod.sh 3."
          elif [ -n "$note" ]; then
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
            echo "> ${note}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Duration-based split confirmed against ${suites} backend suite(s)." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        # always(): when the guard above trips, the plan output is exactly what
        # we need to see in order to diagnose it.
        if: always()
        with:
          name: dd-artifacts-tia-parallel
          path: |
            .testoptimization
            ddtest-plan.log
          include-hidden-files: true

  tia_parallel:
    name: tia-parallel (node ${{ matrix.ci_node_index }})
    runs-on: ubuntu-latest
    needs: [tia_parallel_plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.tia_parallel_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: dd-artifacts-tia-parallel
          path: .testoptimization
      - name: Run duration-split node
        run: bin/ddtest run --ci-node ${{ matrix.ci_node_index }}
        env:
          DD_ENV: ci
          DD_SERVICE: demo-parallel-smart
          # ITR left ON here too, for the same reason as the plan step.
