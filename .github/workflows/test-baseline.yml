name: Test - Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - "demo/**"
    # The flake-prevention demo branch (demo/introduce-flaky-test) also matches
    # "demo/**", and a seeding run is not wanted on it: its PR should carry the
    # single `flaky-suite` check and nothing else. A push that touches only
    # tests/flaky/ is that branch; a push that touches src/ is a real seeding
    # branch and still fires. An empty commit changes no files, so it skips
    # here too -- which is what re-firing the flake demo does.
    paths-ignore:
      - "tests/flaky/**"

env:
  DD_ENV: ci
  DD_SERVICE: demo-baseline

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run full suite without optimization
        # Flaky suite is excluded: test_retry_recoverable.py always fails when
        # Auto Test Retries are off, which they are below. Keeping it in makes
        # this job red every run for reasons unrelated to the baseline.
        run: pytest tests/ --ignore=tests/flaky --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-baseline
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"
