name: Test - Optimized

on:
  workflow_dispatch:
  push:
    branches:
      - "demo/**"
    # The flake-prevention demo branch (demo/introduce-flaky-test) also matches
    # "demo/**", and a seeding run is not wanted on it: its PR should carry the
    # single `flaky-suite` check and nothing else. A push that touches only
    # tests/flaky/ is that branch; a push that touches src/ is a real seeding
    # branch and still fires. An empty commit changes no files, so it skips
    # here too -- which is what re-firing the flake demo does.
    paths-ignore:
      - "tests/flaky/**"

env:
  DD_ENV: ci
  DD_SERVICE: demo-optimized
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: python
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: pytest
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: 1
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: 8

jobs:
  dd_plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - id: dd_plan
        name: Plan optimized test execution
        run: bin/ddtest plan
        env:
          DD_ENV: ci
          DD_SERVICE: demo-optimized
      - uses: actions/upload-artifact@v4
        with:
          name: dd-artifacts-optimized
          path: .testoptimization
          include-hidden-files: true

  dd_test:
    runs-on: ubuntu-latest
    needs: [dd_plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dd_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        with:
          install_ddtest: "true"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: dd-artifacts-optimized
          path: .testoptimization
      - name: Run TIA + parallel tests
        run: bin/ddtest run --ci-node ${{ matrix.ci_node_index }}
        env:
          DD_ENV: ci
          DD_SERVICE: demo-optimized
