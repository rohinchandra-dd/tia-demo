name: TIA PR Demo

# Side-by-side contrast of the same suite with and without Test Impact Analysis.
# Scoped to `preprod` so these are the only two checks on the demo PR.
# The push leg seeds per-test coverage for demo-tia; without it TIA has nothing
# to skip against (Datadog does not backfill coverage for Python).
#
# The `paths` filter keeps this off the Test Parallelization demo's PR, which
# also targets `preprod` but touches other domains. For pull_request events
# GitHub evaluates `paths` against the whole PR diff (a three-dot diff against
# the merge base), not the latest push — so pushing an empty commit to
# re-trigger the demo still matches. Do NOT add `paths` to the push trigger:
# that uses a two-dot diff, where an empty commit changes nothing and the
# seeding run would silently not fire.

on:
  pull_request:
    branches:
      - preprod
    paths:
      - "src/billing/**"
  push:
    branches:
      - preprod

env:
  DD_ENV: ci

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run full suite without Test Impact Analysis
        run: pytest tests/ --ignore=tests/flaky --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-baseline
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"

  tia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run same suite with Test Impact Analysis
        run: pytest tests/ --ignore=tests/flaky --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-tia
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"
