name: TIA PR Demo

# Side-by-side contrast of the same suite with and without Test Impact Analysis.
# Scoped to `preprod` so these are the only two checks on the demo PR.
# The push leg seeds per-test coverage for demo-tia; without it TIA has nothing
# to skip against (Datadog does not backfill coverage for Python).
#
# The `paths` filter keeps this off the Test Parallelization demo's PR, which
# also targets `preprod` but touches a disjoint set of domains
# (auth/compliance/notifications/shipping). For pull_request events
# GitHub evaluates `paths` against the whole PR diff (a three-dot diff against
# the merge base), not the latest push — so pushing an empty commit to
# re-trigger the demo still matches. Do NOT add `paths` to the push trigger:
# that uses a two-dot diff, where an empty commit changes nothing and the
# seeding run would silently not fire.

on:
  pull_request:
    branches:
      - preprod
    paths:
      - "src/analytics/**"
      - "src/catalog/**"
      - "src/inventory/**"
      - "src/shared/**"
  push:
    branches:
      - preprod

env:
  DD_ENV: ci

jobs:
  baseline:
    name: baseline (node ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run shard without Test Impact Analysis
        run: |
          pytest $(python scripts/shard_by_count.py --shard ${{ matrix.shard }} --nodes 4) \
            --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-baseline
          DD_CIVISIBILITY_ITR_ENABLED: "false"
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"

  tia:
    name: tia (node ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-demo
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
      - name: Run same shard with Test Impact Analysis
        # Identical command and identical shard boundaries to `baseline` above —
        # the ONLY difference between the two legs is DD_CIVISIBILITY_ITR_ENABLED,
        # so node N is directly comparable across them.
        #
        # The demo change touches analytics/catalog/inventory/shared, which puts
        # exactly 4 selected test files in EVERY shard -- so each node runs a
        # similar NUMBER of tests (~48). Only the analytics files carry real
        # duration (24s each), so node 0 takes ~96s while the rest take ~4s.
        # That is the point: equal work by count, wildly unequal by duration.
        # Budgets live in scripts/domain_spec.json.
        run: |
          pytest $(python scripts/shard_by_count.py --shard ${{ matrix.shard }} --nodes 4) \
            --ddtrace -v
        env:
          DD_ENV: ci
          DD_SERVICE: demo-tia
          DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"
